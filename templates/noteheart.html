<body>
  <canvas id="bgCanvas"></canvas>

  <header>
  <h1>🌌 MindOrbit</h1>
  <nav>

  <main>
    <section class="noteheart-card">
      <h2>✍️ NoteHeart</h2>
      <p class="hint">Write your heart out. This is your private, anonymous space 💜</p>

      <textarea id="noteBox" placeholder="Write your heart out..."></textarea>
      <button id="clearNote">🧹 Clear</button>
    </section>
  </main>


   <footer>
  <p>© 2025 MindOrbit · A Safe Place — Raheen</p>
   </footer>

<!-- Inline JS -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const noteBox = document.getElementById("noteBox");
      const clearBtn = document.getElementById("clearNote");

      if (!noteBox || !clearBtn) {
        console.error("NoteBox or Clear button not found!");
        return;
      }

      clearBtn.addEventListener("click", function() {
        noteBox.value = ""; // clears the textarea
        noteBox.focus(); // optional: puts cursor back in textarea
      });
    });
  </script>
<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
