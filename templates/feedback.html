<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MindOrbit - Feedback</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <header>
    <h1>🌌 MindOrbit</h1>
    <nav>
           <a href="/home">Home</a>
      <a href="/chat">Chat</a>
      <a href="/moodgame">Moodgames</a>
      <a href="/noteheart">NoteHeart</a>
      <a href="/calmspace">CalmSpace</a>
      <a href="/badges">Badges</a>
      <a href="/feedback">Feedback</a>
      <a href="/about">About</a>
            <a href="/contact">Contact</a>

      <a href="/">Sign Up</a>


    </nav>
  </header>

  <main>
    <section class="futuristic-card">
      <h2>📩 Feedback</h2>
      <p class="hint">Your feedback is anonymous and matters. Tell us what you liked, want improved or any ideas.</p>

      <form action="https://formspree.io/f/mvgbvoqn" method="POST">
        <label>Your message (optional name)</label>
        <textarea name="message" placeholder="Write your feedback..." required></textarea>

        <label>Category</label>
        <select name="category">
          <option value="general">General</option>
          <option value="bug">Bug report</option>
          <option value="idea">Idea / Feature</option>
          <option value="other">Other</option>
        </select>

        <button type="submit">Send Feedback</button>
      </form>
    </section>
  </main>

  <footer>
  <p>© 2025 MindOrbit · A Safe Place — Raheen</p>
</footer>
  
 <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
