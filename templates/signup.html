<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MindOrbit - Welcome</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* 3D card styles */
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .hero {
      perspective: 1200px;
      width: 960px;
      max-width: 96%;
      margin: 2rem auto;
      display:flex; gap:24px; align-items:center; justify-content:center;
      flex-wrap:wrap;
    }
    .card {
      width: 420px; padding:28px; border-radius:16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.06);
      transform-style: preserve-3d;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 18px 40px rgba(2, 40, 80, 0.5);
    }
    .card:hover { transform: rotateX(6deg) rotateY(-6deg) translateY(-6px); box-shadow: 0 28px 60px rgba(2,40,80,0.65); }
    .card h2 { color:#00ffe0; margin-bottom:6px; }
    .card .form { display:flex; flex-direction:column; gap:10px; }
    .guest {
      display:flex; flex-direction:column; gap:8px; align-items:center;
    }
    .logo {
      font-size:2rem; color:transparent;
      background: linear-gradient(90deg,#00ffe0,#ff00ff);
      -webkit-background-clip:text; background-clip:text;
      font-weight:900;
      letter-spacing:2px;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="hero">
    <div class="card">
      <div class="logo">🌌 MindOrbit</div>
      <h2>Welcome</h2>
      <p class="hint">Sign in to personalize — or continue as guest.</p>
      <form id="signupForm" class="form">
        <input type="text" id="name" placeholder="Name (optional)">
        <input type="number" id="age" placeholder="Age">
        <select id="country">
          <option value="">Select Country</option>
          <option value="india">India</option>
          <option value="usa">USA</option>
          <option value="other">Other</option>
        </select>
        <input type="email" id="email" placeholder="Email (optional)">
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div class="card guest">
      <h3>Continue as Guest</h3>
      <p class="hint">No sign-in required. Explore MindOrbit freely.</p>
      <button onclick="continueGuest()">✨ Continue as Guest</button>
      <p class="hint">Or connect later from the menu.</p>
    </div>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e){
      e.preventDefault();
      // save small prefs optionally
      localStorage.setItem("userName", document.getElementById("name").value || "Guest");
      localStorage.setItem("userAge", document.getElementById("age").value || "");
      localStorage.setItem("userCountry", document.getElementById("country").value || "");
      window.location.href = "/home";
    });
    function continueGuest(){
      localStorage.setItem("userName","Guest");
      window.location.href = "/home";
    }
  </script><footer style="width: 100%; text-align: center; padding: 15px 0; background: #000; border-top: 1px solid #00eaff;">
    <p style="color: #00eaff; margin: 0 0 8px;">© 2025 MindOrbit: A Safe Place – Raheen</p>
    
    <a href="/privacy" style="color: #00eaff; margin: 0 10px; text-decoration: none;">Privacy Policy</a> |
    <a href="/terms" style="color: #00eaff; margin: 0 10px; text-decoration: none;">Terms & Conditions</a> |
  
</footer>
<canvas id="bgCanvas"></canvas>
     <script src="{{ url_for('static', filename='script.js') }}" defer></script>

</body>
</html>
