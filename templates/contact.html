<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindOrbit - Contact</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      flex-direction: column;
    }

    .contact-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      backdrop-filter: blur(12px);
      text-align: center;
      box-shadow: 0 0 25px rgba(0,255,255,0.3);
    }

    .contact-card h2 {
      color: #00ffe0;
      margin-bottom: 1rem;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .contact-form input, .contact-form textarea {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      outline: none;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      resize: none;
    }

    .contact-form input:focus, .contact-form textarea:focus {
      box-shadow: 0 0 10px #00ffe0;
    }

    .contact-form button {
      background: linear-gradient(90deg,#00ffe0,#ff00ff);
      border: none;
      border-radius: 8px;
      color: white;
      padding: 0.8rem;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .contact-form button:hover {
      transform: scale(1.05);
    }

    .contact-email {
      margin-top: 1rem;
      color: #00ffe0;
      font-weight: 600;
      font-size: 1rem;
    }

    .contact-email a {
      color: #ff00ff;
      text-decoration: none;
      transition: color 0.3s;
    }

    .contact-email a:hover {
      color: #00ffe0;
    }

    footer {
      text-align: center;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <header>
    <h1>🌌 MindOrbit</h1>
    <nav>
      <a href="/home">Home</a>
      <a href="/chat">Chat</a>
      <a href="/moodgame">Games</a>
      <a href="/noteheart">NoteHeart</a>
      <a href="/calmspace">CalmSpace</a>
      <a href="/badges">Badges</a>
      <a href="/feedback">Feedback</a>
      <a href="/about">About</a>
      <a href="/">Sign In</a>
      <a href="/contact" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-card">
      <h2>📩 Get in Touch</h2>
      <p>We’d love to hear from you — share your thoughts, ideas, or suggestions!</p>
      
      <form action="https://formspree.io/f/manbaqen" method="POST" class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="_replyto" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message..." required></textarea>
        <button type="submit">Send Message</button>
      </form>

      <div class="contact-email">
        Or email us directly at: <br>
        <a href="mailto:freshminds@mindorbit.in">freshminds@mindorbit.in</a>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 MindOrbit · A Safe Place — Raheen</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
