<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindOrbit - Connect the Dots</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">

  
</head>
<body class="dotconnect-page">
 <div class="board-wrapper">
   <canvas id="lineCanvass"></canvas>
   <div class="gameBoard" id="board"></div>
  <a href="/moodgame" class="back-btn">⬅ Back</a>


  <header>
    <h1>🌌 MindOrbit</h1>
    <nav>
 <a href="/home">Home</a>
      <a href="/chat">Chat</a>
      <a href="/moodgame">Moodgames</a>
      <a href="/noteheart">NoteHeart</a>
      <a href="/calmspace">CalmSpace</a>
      <a href="/badges">Badges</a>
      <a href="/feedback">Feedback</a>
      <a href="/about">About</a>
            <a href="/contact">Contact</a>

      <a href="/">Sign Up</a>


    </nav>
  </header>

  <main>
    <section class="futuristic-card game-shell">
      <h2>🎇 Connect the Dots</h2>
      <p>Drag to connect adjacent dots of the same color. Release to clear them. Bigger chains = bigger scores!</p>

      <div class="hud">
        <div class="pill">Score: <span id="score">0</span></div>
        <div class="pill">Moves: <span id="moves">30</span></div>
        <div class="pill">Best: <span id="best">0</span></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Dots board"></div>
      </div>

      <div class="controls">
        <label for="gridSize">Grid</label>
        <select id="gridSize">
          <option value="6">6 × 6</option>
          <option value="8" selected>8 × 8</option>
          <option value="10">10 × 10</option>
        </select>
        <button id="newGame">🔄 New Game</button>
      </div>
    </section>
  </main>

 <footer>
  <p>© 2025 MindOrbit · A Safe Place — Raheen</p>
</footer>

  
  <script src="{{ url_for('static',filename='dotconnect.js') }}" defer></script>
   
</body>
</html>
