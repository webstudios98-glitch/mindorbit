<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Connect — MindOrbit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dotconnect.css') }}">
</head>
<body>
  {% include 'navbar.html' %}

  <div class="dotconnect-container">
    <div class="top-bar">
      <div class="grid-select">
        <label for="gridSize">Grid</label>
        <select id="gridSize">
          <option value="6">6×6</option>
          <option value="8" selected>8×8</option>
          <option value="16">16×16</option>
        </select>
      </div>
      <button id="newGameBtn">🔄 New Game</button>
    </div>

    <div class="info-panel">
      <h2>✨ Connect the Dots</h2>
      <p>Drag to connect adjacent dots of the same color.<br>
      Release to clear them. Bigger chains = bigger scores!</p>
      <p>Score: <span id="score">0</span></p>
      <p>Moves: <span id="moves">30</span></p>
      <p>Best: <span id="best">0</span></p>
    </div>

    <div class="canvas-container">
      <canvas id="dotCanvas" width="500" height="500"></canvas>
    </div>
  </div>
 

  <script src="{{ url_for('static', filename='dotconnect.js') }}"></script>
</body>
</html>
