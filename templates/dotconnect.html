<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindOrbit - Connect the Dots</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Page-specific tweaks (keeps your global style.css) */
    .game-shell { max-width: 900px; margin: 0 auto; }
    .hud {
      display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center;
      margin: 0.75rem 0 1.25rem;
    }
    .hud .pill {
      padding: 10px 14px; border:2px solid rgba(255,255,255,0.2);
      border-radius: 999px; background: rgba(255,255,255,0.06);
      font-weight:700; letter-spacing:.3px;
    }
    .board-wrap {
      display:flex; justify-content:center;
    }
    .board {
      position: relative;
      touch-action: none; /* enables our custom touch handling */
      user-select: none;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0,255,255,0.2);
      overflow: hidden;
      transition: transform .15s ease;
    }
    .board:active { transform: scale(0.995); }
    .cell {
      position: absolute;
      width: var(--cell);
      height: var(--cell);
      display:flex; justify-content:center; align-items:center;
    }
    .dot {
      width: calc(var(--cell) * 0.62);
      height: calc(var(--cell) * 0.62);
      border-radius: 50%;
      box-shadow: 0 0 16px currentColor, inset 0 0 12px rgba(255,255,255,0.35);
      transition: transform .12s ease, opacity .2s ease;
      transform: scale(1);
    }
    .dot.selected { transform: scale(0.85); }
    .dot.clearing { opacity: 0; transform: scale(0.2); }

    /* Connection line canvas sits on top */
    #pathCanvas {
      position:absolute; left:0; top:0; pointer-events:none;
    }

    .controls { margin-top: 1rem; display:flex; gap:10px; justify-content:center; }
    .controls select, .controls button {
      padding: 10px 12px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35); color:#fff; font-weight:600;
      cursor:pointer;
    }
    .controls button:hover { border-color:#00ffe0; }

    /* Responsive board sizing */
    @media (max-width: 540px){
      .board { width: 92vw !important; height: 92vw !important; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <a href="/moodgame" class="back-btn">⬅ Back</a>


  <header>
    <h1>🌌 MindOrbit</h1>
    <nav>
 <a href="/home">Home</a>
      <a href="/chat">Chat</a>
      <a href="/moodgame">Moodgames</a>
      <a href="/noteheart">NoteHeart</a>
      <a href="/calmspace">CalmSpace</a>
      <a href="/badges">Badges</a>
      <a href="/feedback">Feedback</a>
      <a href="/about">About</a>
            <a href="/contact">Contact</a>

      <a href="/">Sign Up</a>


    </nav>
  </header>

  <main>
    <section class="futuristic-card game-shell">
      <h2>🎇 Connect the Dots</h2>
      <p>Drag to connect adjacent dots of the same color. Release to clear them. Bigger chains = bigger scores!</p>

      <div class="hud">
        <div class="pill">Score: <span id="score">0</span></div>
        <div class="pill">Moves: <span id="moves">30</span></div>
        <div class="pill">Best: <span id="best">0</span></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Dots board"></div>
      </div>

      <div class="controls">
        <label for="gridSize">Grid</label>
        <select id="gridSize">
          <option value="6">6 × 6</option>
          <option value="8" selected>8 × 8</option>
          <option value="10">10 × 10</option>
        </select>
        <button id="newGame">🔄 New Game</button>
      </div>
    </section>
  </main>

 <footer>
  <p>© 2025 MindOrbit · A Safe Place — Raheen</p>
</footer>

  <script src="{{ url_for('static',filename='script.js') }}" defer></script>
  <script src="{{ url_for('static',filename='dotconnect.js') }}" defer></script>
   
</body>
</html>
