<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LexiLink — Word Builder</title>

  <!-- global theme first, then game-specific -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='lexilink.css') }}">
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <!-- ✅ Navbar inserted here -->
  <header>
    <h1>MindOrbit</h1>
    <nav>
      <a href="/home">Home</a>
      <a href="/chat">Chat</a>
      <a href="/moodgame">MoodGames</a>
      <a href="/noteheart">NoteHeart</a>
      <a href="/calmspace">CalmSpace</a>
      <a href="/badges">Badges</a>
      <a href="/feedback">Feedback</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/signup">Sign Up</a>
    </nav>
  </header>
  <!-- ✅ End Navbar -->

  <a class="back-btn" href="/moodgame">⬅ Back</a>

  <main class="futuristic-card lexi-shell">
    <header class="lexi-header">
      <h1>🔤 LexiLink</h1>
      <p class="sub">Drag letters or tap to build real words — focus & relax ✨</p>
    </header>

    <section class="lexi-board">
      <!-- 🍪 Word Cookies–style circular tray -->
<div id="game-board">
  <div id="tray" class="neon-tray">
    <div id="letters" class="letters" role="list" aria-label="Letters"></div>
  </div>
</div>

      <!-- user controls -->
      <div class="controls">
        <input id="wordInput" type="text" placeholder="Type or drag letters here" autocomplete="off" aria-label="Your word">
        <button id="submitBtn">Submit</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div class="game-info">
        <span id="timer">⏳ 60s</span>
        <span id="score">Score: 0</span>
        <div id="message" class="msg"></div>
      </div>
    </section>

    <footer class="lexi-footer">
      <small>Single-level endless mode — relax & play ✨</small>
    </footer>
  </main>

  <!-- ✅ Correct audio path (directly in root, not in static) -->
  <audio id="pingSound" src="ping.mp3" preload="auto"></audio>

  <script src="{{ url_for('static', filename='lexilink.js') }}"></script>
</body>
</html>
