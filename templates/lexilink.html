{% include 'navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiLink — Word Builder</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='lexilink.css') }}">
</head>
<body>

  <div class="game-container">
    <h2>🔤 LexiLink — Word Builder</h2>

    <div id="letters" class="letters"></div>

    <input id="wordInput" type="text" placeholder="Type a word..." autofocus />
    <button id="submitBtn">Submit</button>

    <p id="timer">⏳ 60s</p>
    <p id="score">Score: 0</p>
    <p id="message"></p>

    <!-- ✅ Back button -->
    <button id="backBtn" onclick="window.location.href='/games'">⬅ Back</button>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='lexilink.js') }}"></script>
</body>
</html>
